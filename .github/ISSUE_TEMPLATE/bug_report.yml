name: Bug report
description: Report a reproducible application issue.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include credentials or customer data. Report security vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the affected page and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device, and environment
      placeholder: Chrome on Android, public production website
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove private information before sharing.
