name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Shared database consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: node scripts/check-database.mjs

  backend:
    name: Backend build and access tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend types and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ci?schema=public
      AUTH_SECRET: ci-only-placeholder-secret-at-least-32-characters
      NEXT_PUBLIC_APP_URL: https://advikfurniture.vercel.app
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm exec prisma generate
      - run: npm run typecheck
      - run: npm run build
